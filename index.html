    /*
     * A página inteira será ocupada pelo
     * container do MindAR.
     */

    html,
    body {

      margin: 0;
      padding: 0;

      width: 100%;
      height: 100%;

      overflow: hidden;

      background: #000;

    }


    /*
     * Este é o elemento onde o MindAR
     * coloca a câmera.
     */

    #ar-container {

      position: fixed;

      top: 0;
      left: 0;

      width: 100%;
      height: 100%;

      overflow: hidden;

      background: #000;

    }


    /*
     * O vídeo da câmera criado pelo MindAR
     * deve ocupar a tela inteira.
     */

    #ar-container video {

      position: absolute !important;

      top: 0 !important;
      left: 0 !important;

      width: 100% !important;
      height: 100% !important;

      object-fit: cover !important;

    }


    /*
     * O canvas do Three.js fica sobre
     * a câmera.
     */

    #ar-container canvas {

      position: absolute !important;

      top: 0 !important;
      left: 0 !important;

      width: 100% !important;
      height: 100% !important;

      pointer-events: none;

    }


    /*
     * Tela inicial
     */

    #start-screen {

      position: fixed;

      inset: 0;

      z-index: 1000;

      display: flex;

      align-items: center;

      justify-content: center;

      background: rgba(0, 0, 0, 0.88);

      padding: 24px;

      box-sizing: border-box;

    }


    #start-button {

      border: 0;

      border-radius: 14px;

      padding: 17px 24px;

      background: #fff;

      color: #111;

      font-family: Arial, sans-serif;

      font-size: 18px;

      font-weight: bold;

      cursor: pointer;

      box-shadow:
        0 4px 18px rgba(0,0,0,.35);

    }


    #start-button:disabled {

      opacity: .65;

    }


    /*
     * Mensagem de status
     */

    #status {

      left: 50%;

      color: #fff;

      font-family: Arial, sans-serif;

      font-size: 14px;

      text-align: center;

      pointer-events: none;

      max-width: 85vw;

    }

      display: none;

    }

    const videoTexture =

    videoTexture.colorSpace =
      THREE.SRGBColorSpace;

      THREE.RGBAFormat;
