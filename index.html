```html
<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>WebAR Teste</title>

  <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>

  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>

  <style>

    html,
    body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
    }

    body {
      background: black;
    }

    a-scene {
      width: 100%;
      height: 100%;
    }

    #startScreen {

      position: fixed;

      inset: 0;

      z-index: 1000;

      display: flex;

      align-items: center;

      justify-content: center;

      background: rgba(0,0,0,.85);
    }

    #startButton {

      padding: 18px 24px;

      border: 0;

      border-radius: 12px;

      font-size: 18px;

      font-weight: bold;

      background: white;

      color: black;
    }

    #status {

      position: fixed;

      top: 15px;

      left: 50%;

      transform: translateX(-50%);

      z-index: 900;

      padding: 10px 14px;

      border-radius: 10px;

      background: rgba(0,0,0,.6);

      color: white;

      font-family: Arial, sans-serif;

      font-size: 14px;

    }

  </style>

</head>


<body>


  <div id="startScreen">

    <button id="startButton">
      Iniciar câmera
    </button>

  </div>


  <div id="status">
    Toque em "Iniciar câmera".
  </div>


  <a-scene

    mindar-image="
      imageTargetSrc: ./targets.mind;
      autoStart: false;
      uiScanning: false;
      uiLoading: true;
      uiError: true;
    "

    color-space="sRGB"

    renderer="
      colorManagement: true;
      physicallyCorrectLights;
    "

    vr-mode-ui="enabled: false"

    device-orientation-permission-ui="enabled: false"
  >


    <a-camera
      position="0 0 0"
      look-controls="enabled: false">
    </a-camera>


    <a-entity
      id="target"
      mindar-image-target="targetIndex: 0"
    >

    </a-entity>


  </a-scene>


  <script>

    const scene =
      document.querySelector("a-scene");

    const startScreen =
      document.querySelector("#startScreen");

    const startButton =
      document.querySelector("#startButton");

    const status =
      document.querySelector("#status");

    const target =
      document.querySelector("#target");


    /*
     * MindAR pronto
     */

    scene.addEventListener(
      "arReady",
      () => {

        status.textContent =
          "Câmera pronta. Aponte para a imagem.";

      }
    );


    /*
     * Erro
     */

    scene.addEventListener(
      "arError",
      () => {

        status.textContent =
          "Erro ao iniciar a câmera.";

      }
    );


    /*
     * Botão
     */

    startButton.addEventListener(
      "click",
      async () => {

        try {

          const mindarSystem =
            scene.systems[
              "mindar-image-system"
            ];

          await mindarSystem.start();

          startScreen.style.display =
            "none";

          status.textContent =
            "Câmera iniciada. Aponte para a imagem.";

        }

        catch (error) {

          console.error(error);

          status.textContent =
            "Não foi possível iniciar a câmera.";

        }

      }
    );


    /*
     * Reconhecimento
     */

    target.addEventListener(
      "targetFound",
      () => {

        status.textContent =
          "IMAGEM RECONHECIDA!";

        console.log(
          "TARGET FOUND"
        );

      }
    );


    target.addEventListener(
      "targetLost",
      () => {

        status.textContent =
          "Aponte novamente para a imagem.";

        console.log(
          "TARGET LOST"
        );

      }
    );

  </script>


</body>

</html>
```
