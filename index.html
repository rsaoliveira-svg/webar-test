<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, viewport-fit=cover"
  >

  <meta
    name="apple-mobile-web-app-capable"
    content="yes"
  >

  <meta
    name="mobile-web-app-capable"
    content="yes"
  >

  <meta
    name="apple-mobile-web-app-status-bar-style"
    content="black-translucent"
  >

  <title>WebAR</title>

  <!-- A-Frame -->
  <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>

  <!-- MindAR -->
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>


  <style>

    html,
    body {
      margin: 0;
      padding: 0;

      width: 100%;
      height: 100%;

      overflow: hidden;

      background: #000;
    }


    /*
      O container ocupa toda a tela.
    */

    .example-container {

      position: fixed;

      top: 0;
      left: 0;

      width: 100%;
      height: 100%;

      overflow: hidden;
    }


    /*
      O A-Frame ocupa toda a tela.
      Não estamos alterando a câmera do MindAR.
    */

    a-scene {

      position: fixed !important;

      top: 0 !important;
      left: 0 !important;

      width: 100% !important;
      height: 100% !important;
    }


    /*
      Tela inicial.
      Aparece somente antes de iniciar o AR.
    */

    #startScreen {

      position: fixed;

      top: 0;
      left: 0;

      width: 100%;
      height: 100%;

      z-index: 1000;

      display: flex;

      align-items: center;
      justify-content: center;

      background: rgba(0, 0, 0, 0.88);

      padding: 24px;

      box-sizing: border-box;
    }


    #startButton {

      border: none;

      border-radius: 14px;

      padding: 17px 24px;

      background: white;

      color: #111;

      font-family: Arial, sans-serif;

      font-size: 18px;

      font-weight: bold;

      cursor: pointer;

      box-shadow:
        0 4px 18px rgba(0,0,0,.35);
    }


    #startButton:disabled {

      opacity: .65;

    }


    /*
      Mensagem pequena no topo.
    */

    #status {

      position: fixed;

      top: 18px;
      left: 50%;

      transform: translateX(-50%);

      z-index: 900;

      padding: 9px 13px;

      border-radius: 10px;

      background: rgba(0,0,0,.55);

      color: white;

      font-family: Arial, sans-serif;

      font-size: 14px;

      text-align: center;

      pointer-events: none;

      max-width: 85vw;
    }


    /*
      Quando o AR estiver funcionando,
      podemos esconder a mensagem.
    */

    #status.hidden {

      display: none;

    }

  </style>

</head>


<body>


  <!--
    Tela inicial
  -->

  <div id="startScreen">

    <button id="startButton">
      Iniciar AR com áudio
    </button>

  </div>


  <!--
    Status
  -->

  <div id="status">
    Toque em “Iniciar AR com áudio”.
  </div>


  <!--
    AR
  -->

  <div class="example-container">


    <a-scene

      mindar-image="
        imageTargetSrc: ./targets.mind;
        autoStart: false;
        uiScanning: false;
        uiLoading: false;
        uiError: false;
      "

      embedded

      color-space="sRGB"

      renderer="
        colorManagement: true;
        physicallyCorrectLights;
      "

      vr-mode-ui="enabled: false"

      device-orientation-permission-ui="enabled: false"
    >


      <!--
        VÍDEO
      -->

      <a-assets>

        <video

          id="arVideo"

          src="./video.mp4"

          preload="auto"

          loop

          playsinline

          webkit-playsinline

        ></video>

      </a-assets>


      <!--
        CÂMERA DO A-FRAME / MINDAR

        Não colocamos imagem de referência aqui.
      -->

      <a-camera

        position="0 0 0"

        look-controls="enabled: false"

      ></a-camera>


      <!--
        ALVO

        O targets.mind é usado somente
        para reconhecer a imagem.

        A imagem original NÃO é exibida.
      -->

      <a-entity

        id="imageTarget"

        mindar-image-target="targetIndex: 0"

      >


        <!--
          VÍDEO SOBRE O ALVO
        -->

        <a-video

          id="videoPlane"

          src="#arVideo"

          position="0 0 0.01"

          width="1"

          height="0.5625"

          rotation="0 0 0"

        ></a-video>


      </a-entity>


    </a-scene>

  </div>


  <script>

    /*
      Elementos
    */

    const scene =
      document.querySelector("a-scene");

    const video =
      document.querySelector("#arVideo");

    const target =
      document.querySelector("#imageTarget");

    const startScreen =
      document.querySelector("#startScreen");

    const startButton =
      document.querySelector("#startButton");

    const status =
      document.querySelector("#status");


    /*
      Tela cheia
    */

    async function entrarTelaCheia() {

      try {

        const elemento =
          document.documentElement;

        if (
          elemento.requestFullscreen &&
          !document.fullscreenElement
        ) {

          await elemento.requestFullscreen();

        }

      } catch (erro) {

        console.log(
          "Tela cheia não disponível:",
          erro
        );

      }

    }


    /*
      Quando o MindAR estiver pronto.
    */

    scene.addEventListener(
      "arReady",
      () => {

        status.textContent =
          "Aponte a câmera para a imagem.";

      }
    );


    /*
      Erro
    */

    scene.addEventListener(
      "arError",
      () => {

        status.textContent =
          "Não foi possível iniciar a câmera.";

      }
    );


    /*
      BOTÃO INICIAR
    */

    startButton.addEventListener(
      "click",
      async () => {

        startButton.disabled = true;

        startButton.textContent =
          "Iniciando...";

        status.textContent =
          "Preparando câmera...";


        try {

          /*
            O primeiro toque do usuário
            libera o vídeo com áudio.
          */

          video.muted = false;

          await video.play();

          video.pause();

          video.currentTime = 0;


          /*
            Tela cheia quando o navegador
            permitir.
          */

          await entrarTelaCheia();


          /*
            Esconde a tela inicial.
          */

          startScreen.style.display =
            "none";


          /*
            Inicia o MindAR.
          */

          const mindarSystem =
            scene.systems[
              "mindar-image-system"
            ];


          await mindarSystem.start();


        } catch (erro) {

          console.error(
            "Erro ao iniciar:",
            erro
          );


          /*
            Alguns navegadores podem
            bloquear a tela cheia ou
            o áudio. Isso não deve impedir
            a tentativa de iniciar o AR.
          */

          try {

            const mindarSystem =
              scene.systems[
                "mindar-image-system"
              ];

            await mindarSystem.start();

            startScreen.style.display =
              "none";

          } catch (erroAR) {

            console.error(
              "Erro no MindAR:",
              erroAR
            );

            status.textContent =
              "Não foi possível iniciar a câmera.";

            startButton.disabled =
              false;

            startButton.textContent =
              "Iniciar AR com áudio";

          }

        }

      }
    );


    /*
      IMAGEM ENCONTRADA
    */

    target.addEventListener(
      "targetFound",
      async () => {

        console.log(
          "Target encontrado"
        );


        status.textContent =
          "Imagem reconhecida!";


        /*
          Pequeno atraso para garantir
          que o alvo já esteja estabilizado.
        */

        try {

          video.currentTime = 0;

          await video.play();


          /*
            Depois que o vídeo começou,
            podemos esconder o status.
          */

          setTimeout(() => {

            status.classList.add(
              "hidden"
            );

          }, 1000);


        } catch (erro) {

          console.error(
            "Erro ao reproduzir vídeo:",
            erro
          );


          status.classList.remove(
            "hidden"
          );

          status.textContent =
            "Imagem reconhecida. Toque na tela para reproduzir o vídeo.";

        }

      }
    );


    /*
      IMAGEM PERDIDA
    */

    target.addEventListener(
      "targetLost",
      () => {

        console.log(
          "Target perdido"
        );


        video.pause();


        status.classList.remove(
          "hidden"
        );


        status.textContent =
          "Aponte novamente para a imagem.";

      }
    );


  </script>


</body>

</html>
