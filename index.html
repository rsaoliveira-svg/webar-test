<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Mural AR</title>
  <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>
  <style>
    html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: #000; }
    .example-container { position: fixed; inset: 0; width: 100%; height: 100%; overflow: hidden; }

    #startScreen {
      position: fixed; inset: 0; z-index: 1000;
      display: flex; flex-direction: column; gap: 14px;
      align-items: center; justify-content: center;
      background: rgba(0,0,0,.88); padding: 24px; box-sizing: border-box;
      color: #fff; font: 15px Arial, sans-serif; text-align: center;
    }
    #startButton {
      border: 0; border-radius: 14px; padding: 16px 22px;
      background: #fff; color: #111; font: bold 18px Arial, sans-serif; cursor: pointer;
    }
    #startButton:disabled { opacity: .7; }
    #status {
      position: fixed; z-index: 900; left: 50%; top: calc(env(safe-area-inset-top, 0px) + 14px);
      transform: translateX(-50%); padding: 10px 14px; border-radius: 10px;
      background: rgba(0,0,0,.6); color: #fff; font: 14px Arial, sans-serif;
      text-align: center; pointer-events: none; max-width: 85vw;
    }
  </style>
</head>
<body>
  <div id="startScreen">
    <button id="startButton">Iniciar AR com áudio</button>
    <div id="warn"></div>
  </div>

  <div id="status">Toque em “Iniciar AR com áudio”.</div>

  <div class="example-container">
    <!-- Valores de ui* devem ser "yes" ou "no" (true/false não funcionam no MindAR). -->
    <a-scene
      mindar-image="imageTargetSrc: ./targets.mind; autoStart: false; uiLoading: yes; uiScanning: yes; uiError: yes; filterMinCF: 0.001; filterBeta: 1000; missTolerance: 10; warmupTolerance: 3;"
      color-space="sRGB"
      renderer="colorManagement: true; physicallyCorrectLights: true"
      vr-mode-ui="enabled: false"
      device-orientation-permission-ui="enabled: false">

      <a-assets>
        <video id="arVideo" src="./video.mp4" preload="auto" loop playsinline webkit-playsinline></video>
      </a-assets>

      <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

      <!-- No MindAR, a largura da imagem-alvo = 1 unidade.
           Seu alvo tem 2000x1414 px, então a altura dele = 0.707.
           O vídeo (16:9) com largura 1 tem altura 0.5625 e fica centralizado sobre a imagem. -->
      <a-entity mindar-image-target="targetIndex: 0">
        <a-video id="videoPlane" src="#arVideo" position="0 0 0.001" width="1" height="0.5625"></a-video>
      </a-entity>
    </a-scene>
  </div>

  <script>
    const scene = document.querySelector('a-scene');
    const statusEl = document.querySelector('#status');
    const video = document.querySelector('#arVideo');
    const startScreen = document.querySelector('#startScreen');
    const startButton = document.querySelector('#startButton');
    const warn = document.querySelector('#warn');
    const target = document.querySelector('[mindar-image-target]');

    let targetVisible = false;

    // Avisos de ambiente
    if (!window.isSecureContext) {
      warn.textContent = 'A câmera só funciona em HTTPS (ex.: GitHub Pages).';
    } else if (/Instagram|FBAN|FBAV|WhatsApp|Line\//i.test(navigator.userAgent)) {
      warn.textContent = 'Abra o link no Chrome ou Safari: navegadores dentro de apps costumam bloquear a câmera.';
    }

    scene.addEventListener('arReady', () => {
      statusEl.textContent = 'Câmera pronta. Aponte para a imagem.';
    });
    scene.addEventListener('arError', () => {
      statusEl.textContent = 'Não foi possível iniciar a câmera. Verifique a permissão.';
      startScreen.style.display = 'flex';
      startButton.disabled = false;
      startButton.textContent = 'Tentar novamente';
    });

    startButton.addEventListener('click', async () => {
      startButton.disabled = true;
      startButton.textContent = 'Iniciando…';
      statusEl.textContent = 'Preparando áudio e câmera…';

      // 1) Libera o áudio (falhar aqui NÃO impede a câmera de iniciar)
      try {
        await video.play();
        video.pause();
        video.currentTime = 0;
      } catch (e) {
        console.warn('Áudio não liberado:', e);
      }

      // 2) Inicia a câmera / MindAR
      startScreen.style.display = 'none';
      try {
        await scene.systems['mindar-image-system'].start();
      } catch (e) {
        console.error('Erro ao iniciar AR:', e);
        statusEl.textContent = 'Erro ao iniciar a câmera: ' + (e && e.message ? e.message : e);
        startScreen.style.display = 'flex';
        startButton.disabled = false;
        startButton.textContent = 'Tentar novamente';
      }
    });

    target.addEventListener('targetFound', async () => {
      targetVisible = true;
      statusEl.textContent = 'Imagem reconhecida!';
      try {
        await video.play(); // retoma de onde parou
      } catch (e) {
        console.error('Erro ao reproduzir vídeo:', e);
        statusEl.textContent = 'Imagem reconhecida. Toque na tela para reproduzir o vídeo.';
      }
    });

    target.addEventListener('targetLost', () => {
      targetVisible = false;
      statusEl.textContent = 'Aponte novamente para a imagem.';
      video.pause();
    });

    // Plano B: toque na tela inicia o vídeo caso o navegador tenha bloqueado
    document.addEventListener('click', () => {
      if (targetVisible && video.paused) video.play().catch(() => {});
    });
  </script>
</body>
</html>
